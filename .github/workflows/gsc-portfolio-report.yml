name: gsc-portfolio-report

# Reporte semanal del PORTFOLIO de Search Console (las 20 propiedades de la cuenta de Jose):
# genera reports/gsc-portfolio/, lo commitea y emailea el resumen. Hermano de gsc-weekly-report
# (que cubre consignatarias en profundidad). Corre 15 minutos después, el mismo lunes.
# Auth: OAuth de Jose (GSC_OAUTH_CREDENTIALS + GSC_OAUTH_TOKEN) — única credencial que ve las 20.

on:
  schedule:
    - cron: '15 13 * * 1' # lunes 13:15 UTC = 10:15 ART
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GSC_OAUTH_CREDENTIALS: ${{ secrets.GSC_OAUTH_CREDENTIALS }}
      GSC_OAUTH_TOKEN: ${{ secrets.GSC_OAUTH_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      GSC_REPORT_TO: ${{ secrets.GSC_REPORT_TO }}
    steps:
      - name: check config
        id: cfg
        run: |
          if [ -n "$GSC_OAUTH_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin GSC_OAUTH_TOKEN — omitiendo reporte de portfolio."
          fi

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: '22'
      - name: install deps
        if: steps.cfg.outputs.ok == 'true'
        run: npm install --legacy-peer-deps
      - name: generar + emailear reporte
        if: steps.cfg.outputs.ok == 'true'
        run: node scripts/gsc-portfolio-report.mjs
      - name: commit reports
        if: steps.cfg.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/gsc-portfolio/
          if git diff --staged --quiet; then
            echo "sin cambios en reports/"
          else
            git commit -m "chore(reports): portfolio Search Console $(date -u +%Y-W%V)"
            git pull --rebase
            git push
          fi
