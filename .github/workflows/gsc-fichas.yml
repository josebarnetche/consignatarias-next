name: GSC por ficha (Lo que buscan en Google)

# Lunes 12:00 UTC (09:00 ART). Guarda en gsc_fichas, por cada ficha
# /consignatarias/<slug>, las consultas de Google Search Console de 28 y 90 días
# (17-10-2026). Semanal porque GSC llega con 2-3 días de atraso y el panel no
# necesita más frescura que eso. Requiere GSC_SERVICE_ACCOUNT_JSON en Vercel.
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  gsc-fichas:
    runs-on: ubuntu-latest
    steps:
      - name: cron-hook start
        id: cronstart
        run: |
          RUN_ID=$(curl -s -X POST "https://www.consignatarias.com.ar/api/internal/cron-hook" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"workflow_name":"gsc-fichas","phase":"start"}' | jq -r '.run_id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Actualizar gsc_fichas
        run: |
          set -euo pipefail
          RESP=$(curl -sS -m 180 -w $'\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "https://www.consignatarias.com.ar/api/cron/gsc-fichas")
          CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          echo "HTTP $CODE — $BODY"
          { [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; } || { echo "::error::gsc-fichas failed (HTTP $CODE)"; exit 1; }

      - name: cron-hook finish
        if: always() && steps.cronstart.outputs.run_id != ''
        run: |
          ST="ok"; [ "${{ job.status }}" != "success" ] && ST="error"
          curl -s -X POST "https://www.consignatarias.com.ar/api/internal/cron-hook" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"workflow_name\":\"gsc-fichas\",\"phase\":\"finish\",\"run_id\":${{ steps.cronstart.outputs.run_id }},\"status\":\"$ST\"}" || true
