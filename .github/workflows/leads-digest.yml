name: Leads — digest diario de lo que quedó sin responder

# 09:00 ART (12:00 UTC), todos los días. El aviso de lead nuevo ya existe; esto
# es el otro lado: qué sigue abierto, hace cuántos días y en qué orden llamar.
# Va SOLO a las casillas de la casa (LEAD_ALERT_TO). Nada sale al productor.
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      enviar:
        description: 'Mandar el digest por mail (true) o solo imprimirlo (false)'
        required: false
        default: 'true'

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Digest de leads
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.enviar }}" = "true" ]; then
            ARGS="--enviar"
          fi
          npx tsx scripts/leads-digest.ts $ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_ALERT_EMAILS: ${{ secrets.LEAD_ALERT_EMAILS }}
