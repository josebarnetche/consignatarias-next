name: Agente de operaciones

# Llama al agente cada 30 minutos: lee la casilla agente@consignatarias.com y
# avanza los casos. Los horarios de envío los decide el código (días hábiles 8-19
# para contactos nuevos, 7-22 para responder), no este workflow. Ver
# src/lib/agente/motor.ts.
#
# El cron de GitHub con */15 en la práctica corría cada ~3 horas (20/21-10-2026:
# 13:01, 17:59, 21:32, 00:09 UTC). Por eso cada corrida se queda viva ~5 horas
# llamando cada 30 minutos, y el cron la va reemplazando. El repo es público, así
# que los minutos de Actions no se cobran.
#
# Cada corrida encola a la siguiente (29-10-2026). En la práctica el cron de abajo
# no larga cada 2 h sino cada 6-7 h (08:05, 14:43, 20:48, 01:29, 08:45, 16:44,
# 22:43, 06:05, 13:25 entre el 27 y el 29-10), y la corrida dura ~5 h: quedaba un
# hueco de 30 min a 2 h entre una y otra. Por eso el primer paso hace un
# workflow_dispatch de este mismo workflow: con `cancel-in-progress: false` esa
# corrida queda EN ESPERA y arranca apenas termina la viva, aunque la viva muera
# por timeout. GitHub guarda una sola pendiente por grupo (la más nueva), así que
# la cadena no se multiplica y nunca hay dos a la vez. El cron queda de respaldo
# por si la cadena se corta. Bajado de 10 a 30 minutos el 28-10, por pedido de José.
#
# Para FRENAR el agente: `gh workflow disable agente.yml` (cancelar la corrida viva
# no alcanza, porque la siguiente ya está en espera). Para probar en seco:
# curl -X POST /api/cron/agente?dryRun=1 con el CRON_SECRET, no este workflow.
# Un dispatch con dry_run también encola una corrida normal detrás, así que no
# corta la cadena.
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Una sola corrida, sin mandar nada (true/false)'
        default: 'false'

permissions: {}

concurrency:
  group: agente
  cancel-in-progress: false

jobs:
  agente:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      actions: write
    steps:
      - name: Encolar la corrida siguiente
        # Si falla, el agente corre igual y el cron queda de respaldo.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "T0=$(date +%s)" >> "$GITHUB_ENV"
          gh workflow run agente.yml -R "$GITHUB_REPOSITORY" --ref main -f dry_run=false
      - name: Correr el agente cada 30 minutos
        run: |
          Q=""; VUELTAS=10
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then Q="?dryRun=1"; VUELTAS=1; fi
          for i in $(seq 1 $VUELTAS); do
            RESP=$(curl -sS -m 320 -w $'\n%{http_code}' -X POST \
              "https://www.consignatarias.com.ar/api/cron/agente$Q" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || printf '\n000')
            CODE=$(printf '%s' "$RESP" | tail -n1)
            BODY=$(printf '%s' "$RESP" | sed '$d')
            echo "$(date -u +%H:%M) vuelta $i · HTTP $CODE — $(printf '%s' "$BODY" | head -c 400)"
            # Con `&&` la última vuelta devolvía 1 y la corrida quedaba en rojo.
            if [ "$i" -lt "$VUELTAS" ]; then sleep 1800; fi
          done
      # Freno: si la corrida duró menos de 20 min algo falló antes de trabajar
      # (shell, runner, secret). Sin esto la cadena se vuelve un lazo de corridas
      # de segundos; se cancela la pendiente y queda el cron de respaldo. El
      # dry_run hace una sola vuelta corta a propósito: no frena.
      - name: Frenar la cadena si la corrida fue corta
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DUR=$(( $(date +%s) - ${T0:-0} ))
          echo "duración: $((DUR / 60)) min"
          if [ -n "$T0" ] && [ "$DUR" -lt 1200 ]; then
            # La que espera por concurrency figura como pending; queued por las dudas.
            for S in pending queued; do
              gh run list -R "$GITHUB_REPOSITORY" -w agente.yml -s $S --json databaseId -q '.[].databaseId' \
                | xargs -r -n1 gh run cancel -R "$GITHUB_REPOSITORY" || true
            done
          fi
