name: Scrape Auctions & Match Videos

# Daily 17:00 UTC (14:00 ART) — matches MAG closing time. Weekends run too:
# the build-trigger file forces a rebuild so date-sensitive static pages
# (/remates/manana, /remates/hoy, profile "upcoming" filters) stay fresh.
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch: # Manual trigger anytime

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: cron-hook start
        id: cronstart
        run: |
          RUN_ID=$(curl -s -X POST "https://www.consignatarias.com.ar/api/internal/cron-hook" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"workflow_name":"scrape-auctions","phase":"start"}' | jq -r '.run_id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # TODO: bump to setup-node@v5 once pnpm-lock.yaml is removed or corepack
      # is wired up — v5 autodetects pnpm-lock.yaml and fails (no pnpm in runner).
      # Node 20 deprecation: required action by 2026-06-02.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run scraper
        run: node scripts/scrape-auctions.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Match YouTube videos
        run: npx tsx scripts/match-youtube-videos.ts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # Always touch a tiny trigger file so a rebuild fires even when the
      # scraper found no new data (e.g., weekend, MAG hasn't published yet).
      # Without this, ~13 pages that snapshot `new Date()` at SSG time freeze
      # — which is exactly how /remates/manana ended up showing 26-Apr.
      - name: Update build trigger
        run: |
          mkdir -p src/lib/data
          cat > src/lib/data/last-build-trigger.json <<EOF
          {
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "trigger": "${{ github.event_name }}",
            "runId": "${{ github.run_id }}"
          }
          EOF

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/lib/data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/
          AUCTION_COUNT=$(node -e "console.log(require('./src/lib/data/remates.json').length)")
          # If anything besides the trigger file changed, this is a real data update.
          # Otherwise it's a freshness rebuild — keep the message specific so the log is honest.
          if git diff --cached --name-only | grep -qv 'last-build-trigger.json'; then
            MSG="data: update auctions ($AUCTION_COUNT) + match videos — $(date -u +%Y-%m-%d)"
          else
            MSG="ci: daily rebuild trigger — $(date -u +%Y-%m-%d)"
          fi
          git commit -m "$MSG"
          git push

      - name: cron-hook finish
        if: always() && steps.cronstart.outputs.run_id != ''
        run: |
          ST="ok"; [ "${{ job.status }}" != "success" ] && ST="error"
          curl -s -X POST "https://www.consignatarias.com.ar/api/internal/cron-hook" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"workflow_name\":\"scrape-auctions\",\"phase\":\"finish\",\"run_id\":${{ steps.cronstart.outputs.run_id }},\"status\":\"$ST\"}" || true
