name: gsc-weekly-report

# Reporte semanal de SEO (Search Console) + tráfico (GA4): genera archivos en
# reports/gsc/, los commitea al repo, y emailea el resumen.
# Auth durable por service account (secret GA4_SA_KEY, agregado como usuario en GSC).
# Si el SA no está configurado, se salta limpio — ver reports/gsc/README.md.

on:
  schedule:
    - cron: '0 13 * * 1' # lunes 13:00 UTC = 10:00 ART
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
      GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
      GSC_OAUTH_CREDENTIALS: ${{ secrets.GSC_OAUTH_CREDENTIALS }}
      GSC_OAUTH_TOKEN: ${{ secrets.GSC_OAUTH_TOKEN }}
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      GSC_REPORT_TO: ${{ secrets.GSC_REPORT_TO }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: check config
        id: cfg
        run: |
          if [ -n "$GSC_SA_KEY" ] || [ -n "$GA4_SA_KEY" ] || [ -n "$GSC_OAUTH_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GSC sin auth configurada — omitiendo reporte. Ver reports/gsc/README.md"
          fi

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: '22'
      - name: install deps
        if: steps.cfg.outputs.ok == 'true'
        run: npm install --legacy-peer-deps
      - name: generar + emailear reporte
        if: steps.cfg.outputs.ok == 'true'
        run: node scripts/gsc-report.mjs
      - name: commit reports
        if: steps.cfg.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/gsc/
          if git diff --staged --quiet; then
            echo "sin cambios en reports/"
          else
            git commit -m "chore(reports): reporte semanal SEO/tráfico $(date -u +%Y-W%V)"
            git push
          fi
