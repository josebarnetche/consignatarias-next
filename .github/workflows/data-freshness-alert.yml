name: Data Freshness Alert

# Late-evening sanity check: did the daily pipeline actually run today? The
# scraper touches src/lib/data/last-build-trigger.json on EVERY run (even when
# MAG published nothing), so its commit date is a faithful "the scraper ran
# today" signal. If a day passes without it (e.g. GitHub dropped/over-delayed
# the cron — exactly what happened 2026-06-16), this job FAILS so GitHub emails
# the repo owner. Zero infra; the fix is `gh workflow run scrape-auctions.yml`.
on:
  schedule:
    - cron: '0 1 * * *' # 22:00 ART — after the 14:00/16:00/18:00 scrape windows + GitHub delay
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v5

      - name: Check the pipeline ran today
        run: |
          TODAY=$(date +%F)
          YESTERDAY=$(date -d yesterday +%F)   # GNU date (ubuntu-latest), respeta TZ=ART del env
          LAST=$(git log -1 --format=%cd --date=format-local:%F -- src/lib/data/last-build-trigger.json || echo "")
          echo "Hoy (ART): $TODAY · ayer: $YESTERDAY · último run del scraper (commit de last-build-trigger.json, ART): ${LAST:-nunca}"
          # Tolerancia de 1 día: el cron '0 1 * * *' (22:00 ART) es best-effort y GitHub
          # lo atrasa hasta cruzar la medianoche ART; ahí TODAY rota y el último scrape
          # (de ayer a la tarde, legítimo) queda a 1 día → falso positivo. Aceptamos hoy
          # O ayer. Si falta un día calendario ENTERO, LAST cae a >=2 días (ni hoy ni ayer)
          # y la alerta vuelve a disparar (preserva el caso real 2026-06-16).
          if [ "$LAST" != "$TODAY" ] && [ "$LAST" != "$YESTERDAY" ]; then
            echo "::error::El scraper no corrió ni hoy ($TODAY) ni ayer ($YESTERDAY) — >=2 días sin data fresca. Último run: ${LAST:-nunca}. El cron de GitHub probablemente se atrasó/saltó. Disparalo: gh workflow run scrape-auctions.yml"
            exit 1
          fi
          echo "✓ El pipeline corrió hoy o ayer — data fresca."

      # El VR es la promesa principal del producto ("cuánto vale tu hacienda hoy,
      # medido en lo que realmente se vendió") y Mi Ganado valúa el rodeo contra
      # esta banda, así que una banda vieja es una valuación equivocada en la
      # portada, no un detalle de un dashboard.
      #
      # POR QUÉ ESTE CHEQUEO EXISTE: entre el 22 y el 26-sep-2026 el job
      # compute-vr-bandas falló tres veces seguidas en "Install deps" y, por un
      # continue-on-error, el workflow reportó success las tres. Las bandas
      # quedaron clavadas 11 días y nadie se enteró. Lo que falló no fue el
      # código: fue que nadie estaba mirando.
      #
      # Se mira `fecha_dato_hasta` del JSON y no la fecha del commit: el commit
      # dice "el job corrió", el dato dice "la banda es fresca". El segundo
      # también atrapa el caso de que el MAG deje de publicar, que es el que no
      # se nota.
      - name: Check the VR bands are fresh
        run: |
          python3 - <<'EOF'
          import json, datetime, os, sys
          # Tolerancia 6 días. El pipeline de lotes corre Mar/Mié/Vie, así que el
          # hueco legítimo más largo es Vie→Mar: el lunes el dato tiene 3 días, y
          # si el cron del martes se atrasa a la madrugada del miércoles llega a 5.
          # A los 6 ya no hay cadencia que lo explique. El apagón de 11 días habría
          # saltado al sexto.
          TOLERANCIA = 6
          d = json.load(open('src/lib/data/vr-bandas.json'))
          hasta = datetime.date.fromisoformat(d['fecha_dato_hasta'])
          hoy = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=-3))).date()
          edad = (hoy - hasta).days
          print(f"Banda VR al {hasta} · hoy (ART) {hoy} · atraso {edad} día(s) · tolerancia {TOLERANCIA}")
          if edad > TOLERANCIA:
              msg = (f"La banda del VR tiene {edad} días de atraso (dato al {hasta}). "
                     f"/vr, /mercado y Mi Ganado están valuando con eso. "
                     f"Revisá el job compute-vr-bandas de mag-lots-pipeline (¿falló?) "
                     f"y si corrió bien, puede que el MAG haya dejado de publicar lotes. "
                     f"Disparalo: gh workflow run mag-lots-pipeline.yml")
              print(f"::error::{msg}")
              sys.exit(1)
          print("✓ Banda del VR fresca.")
          EOF
