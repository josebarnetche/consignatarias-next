name: Monthly Firm Report

# Reporte mensual a cada consignataria con la ficha reclamada: vistas, visitas desde
# IAs, consultas, envíos del newsletter y seguidores del mes cerrado. Se reactivó el
# 17-10-2026: es el "reportes mensuales" que se le promete a PRO.
# 1° de cada mes, 13:00 UTC (10:00 ART), una hora antes del cierre mensual.
on:
  schedule:
    - cron: '0 13 1 * *'
  workflow_dispatch:

jobs:
  send-monthly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Send monthly firm reports
        run: |
          set -euo pipefail
          RESP=$(curl -sS -w $'\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "https://www.consignatarias.com.ar/api/cron/monthly-metrics")
          CODE=$(printf '%s' "$RESP" | tail -n1)
          printf '%s\n' "$RESP" | sed '$d'
          { [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; } || { echo "::error::monthly-metrics failed (HTTP $CODE)"; exit 1; }
