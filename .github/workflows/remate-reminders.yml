name: Remate Reminders

# DISABLED: Cost optimization — no revenue yet
on:
  # schedule:
  #   - cron: '0 11 * * *'
  workflow_dispatch: # Manual trigger only

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send Remate Reminders
        run: |
          response=$(curl -sL -w "\n%{http_code}" -X GET \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://www.consignatarias.com.ar/api/cron/remate-reminders")
          
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          
          echo "Response: $body"
          echo "HTTP Code: $http_code"
          
          if [ "$http_code" -ne 200 ]; then
            echo "Error: Reminder cron failed with HTTP $http_code"
            exit 1
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
