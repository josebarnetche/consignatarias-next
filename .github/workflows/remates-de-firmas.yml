name: Remates de las firmas al calendario

# Lo que una consignataria carga o corrige desde su panel (remate nuevo, hora, flyer,
# catálogo) aparece al instante en su perfil, pero el calendario general, la ficha del
# remate y el mail semanal leen remates.json. Esto lo pasa cada hora entre las 8 y las
# 22 ART; commitea sólo si algo cambió, así que una hora sin cambios no dispara build.
on:
  schedule:
    - cron: '15 11-23,0-1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remates-json
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remates cargados por las firmas
        run: npx tsx scripts/remates-de-firmas.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit y push si cambió
        run: |
          if git diff --quiet src/lib/data/remates.json; then
            echo "Sin cambios."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/remates.json
          git commit -m "data: remates cargados por las firmas — $(date -u +%Y-%m-%dT%H:%M)"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 3))
          done
          exit 1
