name: El Corredor — Publish Monthly Edition

# Runs the 1st calendar day of each month at 17:00 UTC (14:00 ART).
# The publish.py script defaults to --month=auto, which targets the previous month.
on:
  schedule:
    - cron: '0 17 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: "Mes a publicar (YYYY-MM o 'auto')"
        required: false
        default: 'auto'
      skip_blast:
        description: 'Skip email blast (true/false)'
        required: false
        default: 'false'
      force_blast:
        description: 'Blast even without a new edition (re-send current) (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: cron-hook start
        id: cronstart
        run: |
          RUN_ID=$(curl -s -X POST "https://www.consignatarias.com.ar/api/internal/cron-hook" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"workflow_name":"el-corredor-publish","phase":"start"}' | jq -r '.run_id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Chrome (for headless render)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run publish pipeline
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          MONTH_INPUT="${{ github.event.inputs.month || 'auto' }}"
          echo "Chrome: $CHROME_BIN"
          python3 scripts/monthly-report/publish.py --month "$MONTH_INPUT"

      - name: Commit & push new edition
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/el-corredor/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Read manifest to get edition label for commit message
          EDITION=$(python3 -c "import json; print(json.load(open('public/el-corredor/manifest.json'))['current']['edition_label'])")
          git commit -m "data: El Corredor — $EDITION publicado"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Wait for Vercel deploy
        id: waitdeploy
        if: steps.commit.outputs.changed == 'true'
        run: |
          # GATE REAL, no cosmético. Antes era `sleep 90` + un echo informativo: el
          # build de ~3.400 rutas tarda 2-4 min, así que el blast salía contra el
          # deployment ANTERIOR y mandaba el link del mes pasado (2026-08-01).
          # Ahora se poletea hasta que el manifest LIVE sea la edición que acabamos
          # de publicar; si no llega, el job FALLA y no se manda nada.
          TARGET_YM=$(python3 -c "import json; print(json.load(open('public/el-corredor/manifest.json'))['current']['ym'])")
          echo "target_ym=$TARGET_YM" >> $GITHUB_OUTPUT
          echo "Esperando que el deploy sirva la edición $TARGET_YM…"
          for i in $(seq 1 30); do
            sleep 20
            LIVE=$(curl -s -H 'Cache-Control: no-cache' "https://www.consignatarias.com.ar/el-corredor/manifest.json?cb=$(date +%s)" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['current']['ym'])" 2>/dev/null || echo "unknown")
            echo "  intento $i: live=$LIVE"
            if [ "$LIVE" = "$TARGET_YM" ]; then
              echo "✓ deploy propagado tras $((i*20))s"; exit 0
            fi
          done
          echo "::error::El manifest live nunca llegó a $TARGET_YM tras 10 min — NO se envía el blast."
          exit 1

      - name: Blast email to subscribers
        if: (steps.commit.outputs.changed == 'true' || github.event.inputs.force_blast == 'true') && github.event.inputs.skip_blast != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Uses CRON_SECRET (the one secret set in GitHub + Vercel). Fails LOUD on any
          # non-2xx so a broken blast can't hide behind a green check (cf. 1.28.1).
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET not set — cannot blast"; exit 1
          fi
          # Se manda la edición esperada: si la función ve otra (deploy sin propagar),
          # responde 409 y no envía nada. Silencio > link equivocado a 62 personas.
          TARGET_YM="${{ steps.waitdeploy.outputs.target_ym }}"
          echo "Blast de la edición: ${TARGET_YM:-'(sin target, forzado)'}"
          HTTP=$(curl -s -o /tmp/blast.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"expected_ym\":\"${TARGET_YM}\"}" \
            https://www.consignatarias.com.ar/api/el-corredor/blast)
          echo "HTTP $HTTP"; cat /tmp/blast.json || true
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::Blast failed with HTTP $HTTP"; exit 1
          fi

      - name: cron-hook finish
        if: always() && steps.cronstart.outputs.run_id != ''
        run: |
          ST="ok"; [ "${{ job.status }}" != "success" ] && ST="error"
          curl -s -X POST "https://www.consignatarias.com.ar/api/internal/cron-hook" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"workflow_name\":\"el-corredor-publish\",\"phase\":\"finish\",\"run_id\":${{ steps.cronstart.outputs.run_id }},\"status\":\"$ST\"}" || true
