name: Monthly Metrics Email

# DISABLED: Cost optimization — no revenue yet
on:
  # schedule:
  #   - cron: '0 13 1 * *'
  workflow_dispatch: # Manual trigger only

jobs:
  send-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Send monthly metrics emails
        run: |
          curl -s -X POST \
            "${{ secrets.APP_URL }}/api/cron/monthly-metrics?secret=${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            | jq .
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
