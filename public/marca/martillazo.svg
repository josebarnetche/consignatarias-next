  <rect x="150" y="240" width="16" height="52" rx="7" fill="#38bdf8"/>
  <rect x="248" y="240" width="16" height="52" rx="7" fill="#fafafa"/>
</g>
<circle class="dust d0" cx="205" cy="290" r="4" fill="#71717a" style="--dx:-38px;--dy:-26px"/><circle class="dust d1" cx="205" cy="290" r="3" fill="#71717a" style="--dx:-18px;--dy:-48px"/><circle class="dust d2" cx="205" cy="290" r="5" fill="#71717a" style="--dx:14px;--dy:-54px"/><circle class="dust d3" cx="205" cy="290" r="3.5" fill="#71717a" style="--dx:36px;--dy:-30px"/><circle class="dust d4" cx="205" cy="290" r="3" fill="#71717a" style="--dx:54px;--dy:-14px"/><circle class="dust d5" cx="205" cy="290" r="3" fill="#71717a" style="--dx:-52px;--dy:-10px"/>
<rect class="dato" x="196" y="244" width="18" height="18" fill="#38bdf8"/>
<line x1="980" y1="330" x2="980" y2="160" stroke="#fafafa" stroke-width="7"/>
<line x1="954" y1="330" x2="980" y2="268" stroke="#fafafa" stroke-width="4"/>
<line x1="1006" y1="330" x2="980" y2="268" stroke="#fafafa" stroke-width="4"/>
<circle cx="980" cy="152" r="9" fill="#fafafa"/>
