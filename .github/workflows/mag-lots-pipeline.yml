name: MAG Lots Pipeline (haciinfo000007)

# Lote-level scraper: enqueues jobs for today, then loops through them at
# ~1 req/min (MAG agreement). 44 consigs × 2 tipos = 88 jobs per remate day.
# ~90 minutes total. Idempotent — re-running is safe (dedup keys handle it).
on:
  schedule:
    - cron: '42 22 * * 2,3,5'  # Mar/Mié/Vie 19:42 ART, 5min after mag-detailed-prices
                               # Non-round minute avoids GH Actions schedule throttling.
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date YYYY-MM-DD (default: today)'
        required: false
        default: ''
      sleep:
        description: 'Sleep entre jobs en segundos (default 65)'
        required: false
        default: '65'

jobs:
  enqueue-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: cron-hook start
        id: cronstart
        run: |
          RUN_ID=$(curl -s -X POST "https://www.consignatarias.com.ar/api/internal/cron-hook" -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" -H "Content-Type: application/json" -d '{"workflow_name":"mag-lots-pipeline","phase":"start"}' | jq -r '.run_id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # Refresh master list of active consignatarias before enqueueing.
      # Upserts only — never destructive. Without this step the pipeline
      # silently no-ops if mag_consignatarias is empty (observed 2026-05-18:
      # master never populated → queue always empty → 0 lots ever inserted).
      - name: Discover active consignatarias (refresh master)
        run: |
          for start in 1 21 41 61 81 101 121 141 161 181; do
            curl -sL --max-time 60 -X POST \
              -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
              "https://www.consignatarias.com.ar/api/cron/mag-lots-worker?action=discover&start=$start&count=20" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(f\"window {d.get('range',{}).get('from','?')}..{d.get('range',{}).get('to','?')} found={d.get('active_found',0)} upserted={d.get('upserted',0)}\")" \
              2>/dev/null || true
            sleep 3
          done

      - name: Enqueue jobs for date
        id: enqueue
        run: |
          DATE_PARAM=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_PARAM="&date=${{ github.event.inputs.date }}"
          fi

          response=$(curl -sL -w "\n%{http_code}" --max-time 60 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://www.consignatarias.com.ar/api/cron/mag-lots-worker?action=enqueue${DATE_PARAM}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Enqueue HTTP $http_code"
          echo "$body"

          if [ "$http_code" -ne 200 ]; then
            echo "::error::Enqueue failed (HTTP $http_code)"
            exit 1
          fi

      - name: Process queue (loop with sleep)
        run: |
          SLEEP_SEC="${{ github.event.inputs.sleep }}"
          if [ -z "$SLEEP_SEC" ]; then SLEEP_SEC=65; fi

          REMAINING=999
          MAX_ITERATIONS=200
          ITER=0
          PROCESSED=0
          FAILED=0

          while [ "$REMAINING" -gt 0 ] && [ "$ITER" -lt "$MAX_ITERATIONS" ]; do
            ITER=$((ITER + 1))
            response=$(curl -sL --max-time 60 -X POST \
              -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
              "https://www.consignatarias.com.ar/api/cron/mag-lots-worker?action=process")

            REMAINING=$(echo "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('remaining', 0))" 2>/dev/null || echo 0)
            PROCESSED_THIS=$(echo "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('processed', 0))" 2>/dev/null || echo 0)
            FAILED_THIS=$(echo "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); print(1 if d.get('failed_job') else 0)" 2>/dev/null || echo 0)

            PROCESSED=$((PROCESSED + PROCESSED_THIS))
            FAILED=$((FAILED + FAILED_THIS))

            echo "[iter $ITER] processed=$PROCESSED_THIS remaining=$REMAINING failed=$FAILED_THIS"

            if [ "$REMAINING" -eq 0 ] && [ "$PROCESSED_THIS" -eq 0 ]; then
              echo "Queue empty. Done."
              break
            fi

            if [ "$REMAINING" -gt 0 ]; then
              sleep "$SLEEP_SEC"
            fi
          done

          echo ""
          echo "Summary: processed=$PROCESSED failed=$FAILED iterations=$ITER"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: cron-hook finish
        if: always() && steps.cronstart.outputs.run_id != ''
        run: |
          ST="ok"; [ "${{ job.status }}" != "success" ] && ST="error"
          curl -s -X POST "https://www.consignatarias.com.ar/api/internal/cron-hook" -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" -H "Content-Type: application/json" -d "{\"workflow_name\":\"mag-lots-pipeline\",\"phase\":\"finish\",\"run_id\":${{ steps.cronstart.outputs.run_id }},\"status\":\"$ST\"}" || true
