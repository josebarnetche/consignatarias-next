name: Alerta novillo en USD

# Evalúa todos los días si el novillo medido en dólares se apartó más de ±12 % de su
# promedio del mes anterior. **Casi siempre no hace nada**: sobre la serie 2015-2026 la
# regla dispara unas 4 veces por año, y después calla 30 días.
#
# Corre después del scrape del MAG (16:00 ART) para evaluar con la rueda del día ya
# cargada. Si corriera antes, evaluaría siempre con un día de atraso.
on:
  schedule:
    - cron: '30 20 * * 1-5' # 17:30 ART, lunes a viernes
  workflow_dispatch:

jobs:
  evaluar:
    runs-on: ubuntu-latest
    steps:
      - name: cron-hook start
        id: cronstart
        run: |
          RUN_ID=$(curl -s -X POST "https://www.consignatarias.com.ar/api/internal/cron-hook" -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" -H "Content-Type: application/json" -d '{"workflow_name":"alerta-novillo-usd","phase":"start"}' | jq -r '.run_id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Evaluar la alerta
        run: |
          response=$(curl -sL -w "\n%{http_code}" -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://www.consignatarias.com.ar/api/cron/alerta-novillo-usd")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" -ne 200 ]; then
            echo "Error: la alerta fallo con HTTP $http_code"
            exit 1
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: cron-hook finish
        if: always() && steps.cronstart.outputs.run_id != ''
        run: |
          ST="ok"; [ "${{ job.status }}" != "success" ] && ST="error"
          curl -s -X POST "https://www.consignatarias.com.ar/api/internal/cron-hook" -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" -H "Content-Type: application/json" -d "{\"workflow_name\":\"alerta-novillo-usd\",\"phase\":\"finish\",\"run_id\":${{ steps.cronstart.outputs.run_id }},\"status\":\"$ST\"}" || true
