name: Post-Remate Outreach (Pedido de Promedios)

# Every hour 14:00-22:00 UTC (11:00-19:00 ART) every day
# Endpoint skips when no auctions finished ~3h ago, so cost is minimal.
on:
  schedule:
    - cron: '0 14-22 * * *'
  workflow_dispatch: # Manual trigger anytime

jobs:
  trigger-outreach:
    runs-on: ubuntu-latest
    steps:
      - name: cron-hook start
        id: cronstart
        run: |
          RUN_ID=$(curl -s -X POST "https://www.consignatarias.com.ar/api/internal/cron-hook" -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" -H "Content-Type: application/json" -d '{"workflow_name":"post-remate-outreach","phase":"start"}' | jq -r '.run_id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Request auction results from consignatarias
        run: |
          curl -sL -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "https://www.consignatarias.com.ar/api/cron/post-remate-outreach"

      - name: cron-hook finish
        if: always() && steps.cronstart.outputs.run_id != ''
        run: |
          ST="ok"; [ "${{ job.status }}" != "success" ] && ST="error"
          curl -s -X POST "https://www.consignatarias.com.ar/api/internal/cron-hook" -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" -H "Content-Type: application/json" -d "{\"workflow_name\":\"post-remate-outreach\",\"phase\":\"finish\",\"run_id\":${{ steps.cronstart.outputs.run_id }},\"status\":\"$ST\"}" || true
