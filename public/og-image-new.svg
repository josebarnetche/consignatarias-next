<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#18181b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.03"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Logo area (left side) -->
  <g transform="translate(80, 165)">
    <!-- C shape -->
    <path d="M150 0 C67 0 0 67 0 150 C0 233 67 300 150 300 C200 300 243 275 270 237 L210 195 C193 218 173 230 150 230 C107 230 72 195 72 150 C72 105 107 70 150 70 C173 70 193 82 210 105 L270 63 C243 25 200 0 150 0 Z" fill="#e4e4e7"/>
    <!-- Blue square accent -->
    <rect x="235" y="20" width="55" height="55" fill="#06b6d4"/>
  </g>
  
  <!-- Text content (right side) -->
  <g transform="translate(480, 230)">
    <!-- Main title - Sans serif, single line -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#ffffff">
      consignatarias<tspan fill="#06b6d4">.com.ar</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="60" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#a1a1aa">
      Inteligencia del mercado ganadero argentino
    </text>
    
    <!-- Stats row -->
    <g transform="translate(0, 130)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#22c55e" font-weight="600">238+ Remates</text>
      <text x="180" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#71717a">•</text>
      <text x="210" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#22c55e" font-weight="600">364 Frigoríficos</text>
      <text x="420" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#71717a">•</text>
      <text x="450" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#22c55e" font-weight="600">Precios INMAG</text>
    </g>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="#06b6d4"/>
</svg>