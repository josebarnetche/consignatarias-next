name: Espejo pre-oferta El Tigre (elrural)

# Espeja el VALOR ACTUAL del libro de elrural → Supabase (preoferta_mirror).
#
# ⚠️ NO en schedule: elrural está detrás de Cloudflare y bloquea las IP de
# datacenter de GitHub Actions (probado: 0/71 lotes desde CI). Igual que el
# NEA (ver local-nea-fetch.mjs), este scrape debe correr desde una IP
# RESIDENCIAL AR — localmente (cron/launchd en la Mac) durante la ventana de
# pre-oferta. El script tiene guarda: si scrapea 0, no pisa el espejo.
on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Espejar valor actual de elrural
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-preoferta-mirror.mjs
