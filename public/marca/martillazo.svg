<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420">
<style>
.strike{transform-origin:210px 240px;animation:strike 4.2s cubic-bezier(.5,0,.6,1) infinite}
@keyframes strike{0%{transform:rotate(-30deg)}5%{transform:rotate(0)}78%{transform:rotate(0)}96%{transform:rotate(-30deg)}100%{transform:rotate(-30deg)}}
.ring{transform-origin:210px 330px;opacity:0;animation:ring 4.2s linear infinite}
.r2{animation-delay:1.1s}.r3{animation-delay:2.2s}
@keyframes ring{0%,4%{transform:scale(.04);opacity:0}7%{opacity:.9}70%{transform:scale(1);opacity:0}100%{opacity:0}}
.dust{opacity:0;animation:dust 4.2s ease-out infinite}
.d1{animation-delay:.04s}.d2{animation-delay:.08s}.d3{animation-delay:.06s}.d4{animation-delay:.1s}.d5{animation-delay:.02s}
@keyframes dust{0%,4%{transform:translate(0,0);opacity:0}6%{opacity:.9}30%{transform:translate(var(--dx),var(--dy));opacity:0}100%{opacity:0}}
.dato{opacity:0;animation:dato 4.2s cubic-bezier(.2,.7,.4,1) infinite}
@keyframes dato{0%,5%{transform:translate(0,0);opacity:0}9%{opacity:1}62%{transform:translate(740px,-120px);opacity:1}66%{transform:translate(770px,-158px);opacity:0}100%{opacity:0}}
.ping{transform-origin:980px 128px;opacity:0;animation:ping 4.2s ease-out infinite}
@keyframes ping{0%,62%{transform:scale(.2);opacity:0}68%{opacity:1;transform:scale(1)}86%{transform:scale(2.6);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.strike,.ring,.dust,.dato,.ping{animation:none}.ring{opacity:.5;transform:scale(.5)}.dato,.ping{opacity:1}}
</style>
<line x1="40" y1="330" x2="1160" y2="330" stroke="#27272a" stroke-width="2"/>
<circle class="ring r1" cx="210" cy="330" r="360" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 9"/><circle class="ring r2" cx="210" cy="330" r="360" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 9"/><circle class="ring r3" cx="210" cy="330" r="360" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 9"/>
<g class="strike">
  <rect x="196" y="180" width="18" height="118" rx="4" fill="#fafafa"/>
  <rect x="152" y="150" width="106" height="44" rx="8" fill="#fafafa"/>
  <rect x="152" y="150" width="14" height="44" rx="4" fill="#38bdf8"/>
</g>
<rect x="168" y="308" width="84" height="16" rx="3" fill="#fafafa"/>
<circle class="dust d0" cx="210" cy="324" r="4" fill="#71717a" style="--dx:-38px;--dy:-26px"/><circle class="dust d1" cx="210" cy="324" r="3" fill="#71717a" style="--dx:-18px;--dy:-48px"/><circle class="dust d2" cx="210" cy="324" r="5" fill="#71717a" style="--dx:14px;--dy:-54px"/><circle class="dust d3" cx="210" cy="324" r="3.5" fill="#71717a" style="--dx:36px;--dy:-30px"/><circle class="dust d4" cx="210" cy="324" r="3" fill="#71717a" style="--dx:54px;--dy:-14px"/><circle class="dust d5" cx="210" cy="324" r="3" fill="#71717a" style="--dx:-52px;--dy:-10px"/>
<rect class="dato" x="201" y="278" width="18" height="18" fill="#38bdf8"/>
<line x1="980" y1="330" x2="980" y2="160" stroke="#fafafa" stroke-width="7"/>
<line x1="954" y1="330" x2="980" y2="268" stroke="#fafafa" stroke-width="4"/>
<line x1="1006" y1="330" x2="980" y2="268" stroke="#fafafa" stroke-width="4"/>
<circle cx="980" cy="152" r="9" fill="#fafafa"/>
<path d="M 946 118 A 44 44 0 0 1 946 186" fill="none" stroke="#fafafa" stroke-width="3" opacity=".5"/>
<path d="M 924 100 A 70 70 0 0 1 924 204" fill="none" stroke="#fafafa" stroke-width="3" opacity=".28"/>
<circle class="ping" cx="980" cy="128" r="12" fill="#38bdf8"/>
</svg>