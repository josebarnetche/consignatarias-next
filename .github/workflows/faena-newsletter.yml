name: Faena Newsletter

# 3rd of each month, 13:00 UTC (10:00 ART). Sends the national faena report
# (datos.gob.ar, monthly) to subscribers from /frigorificos. The 3rd avoids the
# 1st (monthly-close + El Corredor) and gives gov data time to refresh.
on:
  schedule:
    - cron: '0 13 3 * *'
  workflow_dispatch:

jobs:
  send-faena-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: cron-hook start
        id: cronstart
        run: |
          RUN_ID=$(curl -s -X POST "https://www.consignatarias.com.ar/api/internal/cron-hook" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"workflow_name":"faena-newsletter","phase":"start"}' | jq -r '.run_id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Send Faena Newsletter
        run: |
          set -euo pipefail
          RESP=$(curl -sS -w $'\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "https://www.consignatarias.com.ar/api/cron/faena-newsletter")
          CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          echo "HTTP $CODE — $BODY"
          { [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; } || { echo "::error::faena-newsletter failed (HTTP $CODE)"; exit 1; }

      - name: cron-hook finish
        if: always() && steps.cronstart.outputs.run_id != ''
        run: |
          ST="ok"; [ "${{ job.status }}" != "success" ] && ST="error"
          curl -s -X POST "https://www.consignatarias.com.ar/api/internal/cron-hook" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"workflow_name\":\"faena-newsletter\",\"phase\":\"finish\",\"run_id\":${{ steps.cronstart.outputs.run_id }},\"status\":\"$ST\"}" || true
