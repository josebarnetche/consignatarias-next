name: Monthly Close (Índice Novillo)

# 1st of each month, 14:00 UTC (11:00 ART). Emails subscribers the previous
# month's average INMAG. By the 1st the prior month's last rueda is scraped.
on:
  schedule:
    - cron: '0 14 1 * *'
  workflow_dispatch: # Manual trigger (closes the previous month). Use ?month= via curl for backfill.

jobs:
  send-monthly-close:
    runs-on: ubuntu-latest
    steps:
      - name: Send Monthly Close
        run: |
          set -euo pipefail
          RESP=$(curl -sS -w $'\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "https://www.consignatarias.com.ar/api/cron/monthly-close")
          CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          echo "HTTP $CODE — $BODY"
          { [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; } || { echo "::error::monthly-close failed (HTTP $CODE)"; exit 1; }
