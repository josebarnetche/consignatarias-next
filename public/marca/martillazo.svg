<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420">
<style>
.strike{transform-origin:215px 266px;animation:strike 4.2s ease-in infinite}
@keyframes strike{0%{transform:translateY(-78px) rotate(5deg)}4.5%{transform:translateY(0) rotate(0deg)}6.5%{transform:translateY(-12px) rotate(-2deg)}8.5%{transform:translateY(0) rotate(0deg)}80%{transform:translateY(0) rotate(0deg)}92%{transform:translateY(-78px) rotate(5deg)}100%{transform:translateY(-78px) rotate(5deg)}}
.ring{transform-origin:205px 296px;opacity:0;animation:ring 4.2s linear infinite}
.r2{animation-delay:1.1s}.r3{animation-delay:2.2s}
@keyframes ring{0%,4%{transform:scale(.04);opacity:0}7%{opacity:.9}70%{transform:scale(1);opacity:0}100%{opacity:0}}
.dust{opacity:0;animation:dust 4.2s ease-out infinite}
.d1{animation-delay:.04s}.d2{animation-delay:.08s}.d3{animation-delay:.06s}.d4{animation-delay:.1s}.d5{animation-delay:.02s}
@keyframes dust{0%,4%{transform:translate(0,0);opacity:0}6%{opacity:.9}30%{transform:translate(var(--dx),var(--dy));opacity:0}100%{opacity:0}}
.dato{opacity:0;animation:dato 4.2s cubic-bezier(.2,.7,.4,1) infinite}
@keyframes dato{0%,5%{transform:translate(0,0);opacity:0}9%{opacity:1}62%{transform:translate(745px,-120px);opacity:1}66%{transform:translate(775px,-158px);opacity:0}100%{opacity:0}}
.ping{transform-origin:980px 128px;opacity:0;animation:ping 4.2s ease-out infinite}
@keyframes ping{0%,62%{transform:scale(.2);opacity:0}68%{opacity:1;transform:scale(1)}86%{transform:scale(2.6);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.strike,.ring,.dust,.dato,.ping{animation:none}.ring{opacity:.5;transform:scale(.5)}.dato,.ping{opacity:1}}
</style><rect width="1200" height="420" fill="#09090b"/>
<line x1="40" y1="330" x2="1160" y2="330" stroke="#27272a" stroke-width="2"/>
<circle class="ring r1" cx="205" cy="296" r="360" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 9"/><circle class="ring r2" cx="205" cy="296" r="360" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 9"/><circle class="ring r3" cx="205" cy="296" r="360" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 9"/>
<!-- taco -->
<rect x="148" y="304" width="116" height="14" rx="5" fill="#fafafa"/>
