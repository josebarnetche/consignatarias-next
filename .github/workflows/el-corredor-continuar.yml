name: El Corredor — Continuar envío

# El envío del día 1 (el-corredor-publish.yml) se topea por día (capForFreePlan) y lo
# que pasaba del tope no salía nunca: 34 de 114 en la edición de octubre. Del 2 al 7
# de cada mes esto le pide a /api/el-corredor/blast que siga con quien todavía no la
# recibió (tabla el_corredor_envios). Si ya salió para todos, o si el día 1 no mandó
# nada, la ruta no envía y responde 200. Si Resend rechaza algún correo, queda
# pendiente y vuelve a intentarse al día siguiente.
on:
  schedule:
    - cron: '0 18 2-7 * *' # 15:00 ART, después de los mails del día 2 y del 3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuar:
    runs-on: ubuntu-latest
    steps:
      - name: cron-hook start
        id: cronstart
        run: |
          RUN_ID=$(curl -s -X POST "https://www.consignatarias.com.ar/api/internal/cron-hook" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"workflow_name":"el-corredor-continuar","phase":"start"}' | jq -r '.run_id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Continuar el envío
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET not set — cannot continue"; exit 1
          fi
          HTTP=$(curl -s -o /tmp/continuar.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"mode":"continuar"}' \
            https://www.consignatarias.com.ar/api/el-corredor/blast)
          echo "HTTP $HTTP"; cat /tmp/continuar.json || true
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::Continuar failed with HTTP $HTTP"; exit 1
          fi

      - name: cron-hook finish
        if: always() && steps.cronstart.outputs.run_id != ''
        run: |
          ST="ok"; [ "${{ job.status }}" != "success" ] && ST="error"
          curl -s -X POST "https://www.consignatarias.com.ar/api/internal/cron-hook" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"workflow_name\":\"el-corredor-continuar\",\"phase\":\"finish\",\"run_id\":${{ steps.cronstart.outputs.run_id }},\"status\":\"$ST\"}" || true
