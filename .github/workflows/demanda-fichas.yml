name: demanda-fichas

# Recalcula cuánta demanda recibió cada ficha en los últimos 30 días y commitea
# src/lib/data/demanda-fichas.json. Ese JSON es lo que convierte el CTA de reclamo de una
# promesa genérica ("recibí consultas de compradores") en el número medido de esa firma.
#
# Corre a las 05:10 ART, después de la ventana de scrapes, para no pelear por el rebuild.
# Escribe un JSON committeado y NO se consulta la base en el build: la service-role key
# sólo existe en el entorno Production de Vercel (ver src/lib/supabase-server.ts).

on:
  schedule:
    - cron: '10 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: demanda-fichas
  cancel-in-progress: false

jobs:
  calcular:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      # Node 22, no 20: `@supabase/supabase-js` v2 exige WebSocket nativo y en Node 20
      # aborta con "Node.js 20 detected without native WebSocket support". Local andaba
      # porque la máquina tiene 22.17 — por eso el workflow se prueba, no se supone.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm install <paquete> --no-save` sobre un arbol manejado por pnpm rompe con
      # "Cannot read properties of null (reading 'edgesOut')". Se instala el proyecto
      # entero con --legacy-peer-deps, que es lo que ya hacen scrape-auctions y el resto:
      # @supabase/supabase-js ^2.98.0 ya es dependencia del repo, no hace falta sumarla.
      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Calcular demanda por ficha
        run: node scripts/demanda-fichas.mjs

      - name: Commitear el JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/demanda-fichas.json
          if git diff --staged --quiet; then
            echo "sin cambios"
          else
            git commit -m "data: demanda por ficha (30 d)"
            git pull --rebase --autostash origin main
            git push
          fi
