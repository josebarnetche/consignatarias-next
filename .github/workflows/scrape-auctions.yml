name: Scrape Auctions & Match Videos

# Weekly: Mondays 14:00 UTC (11:00 ART) — keeps data fresh with one rebuild per week
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch: # Manual trigger anytime

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run scraper
        run: node scripts/scrape-auctions.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Match YouTube videos
        run: npx tsx scripts/match-youtube-videos.ts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/lib/data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/
          AUCTION_COUNT=$(node -e "console.log(require('./src/lib/data/remates.json').length)")
          git commit -m "data: update auctions ($AUCTION_COUNT) + match videos — $(date -u +%Y-%m-%d)"
          git push
